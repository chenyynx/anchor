name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-fund --no-audit
      - name: Typecheck (tsc)
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Contract tests
        run: npm run contract
